<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Radar Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.45" />
  <!-- Radar Sweep Sector -->
  <path d="M256,256 L256,66 A190,190 0 0,1 420,161 Z" fill="url(#radarGrad)" />
  <!-- Crosshairs -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />
  <!-- Drone Frame -->
  <g stroke="#f8fafc" stroke-width="14" stroke-linecap="round">
    <line x1="176" y1="176" x2="336" y2="336" />
    <line x1="336" y1="176" x2="176" y2="336" />
  </g>
  <!-- Drone Body -->
  <rect x="224" y="216" width="64" height="80" rx="22" fill="#38bdf8" stroke="#0f172a" stroke-width="8" />
  <circle cx="256" cy="240" r="10" fill="#0f172a" />
  <!-- 4 Rotors -->
  <circle cx="164" cy="164" r="36" fill="#0f172a" stroke="#10b981" stroke-width="10" />
  <circle cx="348" cy="164" r="36" fill="#0f172a" stroke="#10b981" stroke-width="10" />
  <circle cx="164" cy="348" r="36" fill="#0f172a" stroke="#f59e0b" stroke-width="10" />
  <circle cx="348" cy="348" r="36" fill="#0f172a" stroke="#ef4444" stroke-width="10" />
  <!-- Fortress / Warning Blip -->
  <circle cx="345" cy="128" r="10" fill="#ef4444" />
</svg>

